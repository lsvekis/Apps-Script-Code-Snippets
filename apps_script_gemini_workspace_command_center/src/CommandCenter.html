<!DOCTYPE html><html><head><base target="_top">
<style>
body{font-family:Arial,sans-serif;padding:16px}
textarea{width:100%;height:140px;box-sizing:border-box}
button{width:100%;margin-top:10px;padding:11px}
pre{margin-top:15px;padding:12px;background:#f5f5f5;white-space:pre-wrap}
.example{cursor:pointer;margin:8px 0;color:#1a73e8}
</style></head><body>
<h2>AI Workspace</h2><p>What would you like to do?</p>
<textarea id="command" placeholder="Describe a task..."></textarea>
<button id="run" onclick="go()">Run Command</button>
<h3>Try:</h3>
<div class="example" onclick="setC('Analyze this spreadsheet and identify anything management should know.')">Analyze this spreadsheet</div>
<div class="example" onclick="setC('Create an executive report from this spreadsheet.')">Create an executive report</div>
<div class="example" onclick="setC('Give me a quick overview of what is in this sheet.')">Summarize this spreadsheet</div>
<pre id="status">Ready.</pre>
<script>
function setC(t){command.value=t}
function go(){
 const c=command.value;if(!c.trim()){status.textContent="Enter a command.";return}
 run.disabled=true;status.textContent="Understanding request...";
 google.script.run.withSuccessHandler(function(r){
  run.disabled=false;
  let x="Intent: "+r.routing.intent+"\nConfidence: "+r.routing.confidence+"\nRisk: "+r.risk+"\n\n";
  if(r.result.content)x+=r.result.content;
  if(r.result.documentUrl)x+="\n\nReport: "+r.result.documentUrl;
  status.textContent=x;
 }).withFailureHandler(function(e){run.disabled=false;status.textContent="Error: "+e.message}).processCommand(c);
}
</script></body></html>
