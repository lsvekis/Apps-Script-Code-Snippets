<!DOCTYPE html><html><body><h2>AI Automation Agent</h2><textarea id="req" style="width:100%;height:130px">Analyze the sales data in this sheet, create a Google Doc report, and prepare an email summary.</textarea><br><button onclick="plan()">Generate Plan</button><button id="go" disabled onclick="run()">Approve & Execute</button><pre id="out"></pre><script>let p=null;function plan(){out.textContent="Planning...";google.script.run.withSuccessHandler(x=>{p=x;out.textContent=JSON.stringify(x,null,2);go.disabled=false}).withFailureHandler(e=>out.textContent=e.message).createAgentPlan(req.value)}function run(){go.disabled=true;google.script.run.withSuccessHandler(x=>out.textContent=JSON.stringify(x,null,2)).withFailureHandler(e=>out.textContent=e.message).executeAgentPlan(p)}</script></body></html>
